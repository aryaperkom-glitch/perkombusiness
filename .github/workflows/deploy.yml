name: Deploy

# Auto-deploy on every push to main: SSH into the VPS and run scripts/deploy.sh
# (pull ff-only -> docker build -> migrate -> up -> health check).
# Requires repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/officeless
            ./scripts/deploy.sh
